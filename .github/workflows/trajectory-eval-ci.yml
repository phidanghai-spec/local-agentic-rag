name: Trajectory Eval CI Gate

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  trajectory-and-security-gate:
    name: Golden DAG Trajectory & PII Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run PII Proxy & Trajectory Eval CI Gate
        env:
          PYTHONPATH: "."
        run: |
          pytest tests/test_pii_proxy.py tests/test_trajectory_ci.py \
            -v \
            --tb=short \
            --junitxml=trajectory-eval-report.xml

      - name: Publish CI Summary
        if: always()
        run: |
          echo "### Trajectory Eval CI Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trajectory-eval-report.xml ]; then
            echo "- Report generated: \`trajectory-eval-report.xml\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Verified: PIIProxy Guard + MCP 2-Step ERP Chain + CRAG Self-Correction Loop + Max Retry Cap" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JUnit Trajectory Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-eval-junit-report
          path: trajectory-eval-report.xml
